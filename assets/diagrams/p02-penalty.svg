<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Pretendard Variable',Pretendard,-apple-system,'Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="해지 위약금 산정 방식 AS-IS와 TO-BE 비교, 반납 여부에 따른 분기"><rect x="40" y="20" width="280" height="226" rx="8" fill="#fff" stroke="#d9d9d2" stroke-width="1.2"/><rect x="64" y="40" width="55" height="24" rx="12.0" fill="#f6e9e4"/><text x="91.6" y="55" font-size="12" font-weight="700" fill="#9e3d27" text-anchor="middle">AS-IS</text><text x="64" y="96" font-size="17" font-weight="700" fill="#141414" text-anchor="start">월 CMS × 잔여 개월 수</text><text x="64" y="122" font-size="13" font-weight="500" fill="#66665f" text-anchor="start">36개월 정상 사용을 전제로 한 요금</text><text x="64" y="143" font-size="13" font-weight="500" fill="#66665f" text-anchor="start">중도 해지 시 장비 손실 미반영</text><text x="64" y="202" font-size="12" font-weight="600" fill="#66665f" text-anchor="start">대표 사례 위약금</text><text x="64" y="230" font-size="26" font-weight="800" fill="#9e3d27" text-anchor="start">18만 원</text><rect x="360" y="20" width="280" height="226" rx="8" fill="#141414" stroke="#141414" stroke-width="1.2"/><rect x="384" y="40" width="55" height="24" rx="12.0" fill="#7dbf9e"/><text x="411.6" y="55" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">TO-BE</text><text x="384" y="96" font-size="17" font-weight="700" fill="#fff" text-anchor="start">해지 시점 장비 잔존가치</text><text x="384" y="122" font-size="13" font-weight="500" fill="#9b9b93" text-anchor="start">감가상각 기준으로 실제 손실 산정</text><text x="384" y="143" font-size="13" font-weight="500" fill="#9b9b93" text-anchor="start">반납 여부에 따라 환불·청구 분기</text><text x="384" y="202" font-size="12" font-weight="600" fill="#9b9b93" text-anchor="start">대표 사례 위약금</text><text x="384" y="230" font-size="26" font-weight="800" fill="#7dbf9e" text-anchor="start">48만 원</text><path d="M324,133 L356,133" fill="none" stroke="#b04a33" stroke-width="1.6"/><polygon points="347,128 347,138 356,133" fill="#b04a33"/><path d="M500,246 L500,290" fill="none" stroke="#9b9b93" stroke-width="1.6"/><polygon points="495,281 505,281 500,290" fill="#9b9b93"/><path d="M500,268 L180,268 L180,290" fill="none" stroke="#9b9b93" stroke-width="1.6"/><polygon points="175,281 185,281 180,290" fill="#9b9b93"/><rect x="40" y="292" width="280" height="84" rx="8" fill="#eaf3ee" stroke="#7dbf9e" stroke-width="1.2"/><rect x="40" y="302" width="3" height="64" rx="1.5" fill="#7dbf9e"/><text x="180.0" y="321.5" font-size="16" font-weight="700" fill="#141414" text-anchor="middle">장비 정상 반납</text><text x="180.0" y="342.5" font-size="13" font-weight="500" fill="#2c2c2a" text-anchor="middle">위약금 환불</text><text x="180.0" y="361.5" font-size="13" font-weight="500" fill="#2c2c2a" text-anchor="middle">→ 장비 회수를 유도</text><rect x="360" y="292" width="280" height="84" rx="8" fill="#f6e9e4" stroke="#b04a33" stroke-width="1.2"/><rect x="360" y="302" width="3" height="64" rx="1.5" fill="#b04a33"/><text x="500.0" y="321.5" font-size="16" font-weight="700" fill="#9e3d27" text-anchor="middle">장비 미반납</text><text x="500.0" y="342.5" font-size="13" font-weight="500" fill="#2c2c2a" text-anchor="middle">실제 손실 기준으로 청구</text><text x="500.0" y="361.5" font-size="13" font-weight="500" fill="#2c2c2a" text-anchor="middle">지속 미납 시 추심사 이관</text><rect x="40" y="398" width="600" height="56" rx="8" fill="none" stroke="#d9d9d2" stroke-width="1.2" stroke-dasharray="5 4"/><text x="340.0" y="430.9" font-size="14" font-weight="700" fill="#141414" text-anchor="middle">청구 기준 변경에 맞춰 계약서 상세 약관 개정 → 분쟁 근거 정비</text></svg>
