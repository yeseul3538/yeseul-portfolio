<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Pretendard Variable',Pretendard,-apple-system,'Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="일괄 출금과 부분 출금 정책 비교, 수수료 역전 구간 차단" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text x="340" y="34" font-size="14" font-weight="600" fill="#66717d" text-anchor="middle">예시 — 총 미납금 30,000원 · 통장 잔액 12,000원</text><rect x="40" y="56" width="280" height="250" rx="8" fill="#fff" stroke="#e6e2da" stroke-width="1.2"/><rect x="64" y="76" width="55" height="24" rx="12.0" fill="#fdf1ed"/><text x="91.6" y="91" font-size="12" font-weight="700" fill="#c2583f" text-anchor="middle">AS-IS</text><text x="64" y="132" font-size="18" font-weight="700" fill="#13253f" text-anchor="start">일괄 출금</text><text x="64" y="156" font-size="13" font-weight="500" fill="#66717d" text-anchor="start">잔액 ≥ 총 미납금일 때만 출금</text><rect x="64" y="178" width="232" height="30" rx="4" fill="#f4f0e9"/><text x="180.0" y="198" font-size="12" font-weight="600" fill="#c2583f" text-anchor="middle">미납 30,000원 전액 이월</text><text x="64" y="256" font-size="24" font-weight="800" fill="#c2583f" text-anchor="start">회수 0원</text><text x="64" y="282" font-size="13" font-weight="500" fill="#66717d" text-anchor="start">잔액이 모자라면 전혀 출금되지 않음</text><rect x="360" y="56" width="280" height="250" rx="8" fill="#fff" stroke="#e6e2da" stroke-width="1.2"/><rect x="384" y="76" width="55" height="24" rx="12.0" fill="#13253f"/><text x="411.6" y="91" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">TO-BE</text><text x="384" y="132" font-size="18" font-weight="700" fill="#13253f" text-anchor="start">부분 출금</text><text x="384" y="156" font-size="13" font-weight="500" fill="#66717d" text-anchor="start">잔액만큼 먼저 출금</text><rect x="384" y="178" width="232" height="30" rx="4" fill="#f4f0e9"/><rect x="384" y="178" width="92.8" height="30" rx="4" fill="#1e3a5f"/><text x="430.4" y="198" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">12,000원</text><text x="546.4" y="198" font-size="12" font-weight="600" fill="#66717d" text-anchor="middle">잔여 18,000원</text><text x="384" y="256" font-size="24" font-weight="800" fill="#13253f" text-anchor="start">회수 12,000원</text><text x="384" y="282" font-size="13" font-weight="500" fill="#66717d" text-anchor="start">남은 미납은 다음 출금일에 이어서 회수</text><path d="M324,192 L356,192" fill="none" stroke="#e07a5f" stroke-width="1.6"/><polygon points="347,187 347,197 356,192" fill="#e07a5f"/><rect x="40" y="330" width="600" height="104" rx="8" fill="#fdf1ed" stroke="#e07a5f" stroke-width="1.2"/><text x="64" y="362" font-size="15" font-weight="700" fill="#c2583f" text-anchor="start">역전 구간 차단</text><text x="64" y="388" font-size="13" font-weight="500" fill="#3f4b57" text-anchor="start">잔액이 200원 미만일 때 출금하면 이체 수수료가 출금액보다 커져 회수할수록 손해</text><text x="64" y="412" font-size="13" font-weight="600" fill="#13253f" text-anchor="start">→ 최소 출금 단위를 두어 이 구간은 출금하지 않도록 정책에 반영</text><text x="640" y="456" font-size="12" font-weight="500" fill="#66717d" text-anchor="end">퇴사 후 재구성 · 실제 화면·데이터 아님</text></svg>